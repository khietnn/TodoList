<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="title-row">
        <h1 class="name">Todo List</h1>
        <span id="todo-count" class="todo-count"></span>
      </div>
      <form id="todo-form" class="input-section">
        <input id="todo-input" type="text" class="add-items-input" placeholder="Thêm công việc mới..." autocomplete="off" maxlength="200" />
        <button id="add-button" type="submit" class="add-items-button">
          <i class="fa-solid fa-plus"></i><span>Thêm</span>
        </button>
      </form>
    </header>
    <main class="todos-container">
      <p id="todo-status" class="todo-status">Đang tải...</p>
      <ul class="todos-list"></ul>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="./index.js"></script>
</body>
</html>
